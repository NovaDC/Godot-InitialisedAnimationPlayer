[plugin]

name = "InitialisedAnimationPlayer"
description = "A animation player that plays a specified animation on _ready, if the specified animation exists.
As of Godot v4.2.1, the ability to set animations to play on ready is built in. This plugin is intended for use in previous versions."
author = "NovaDC"
version = "v1.0.1.0"
script = "plugin.gd"
